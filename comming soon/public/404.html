<!DOCTYPE html>
<html>
<head>
  <title>404 Not Found</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="theme-color" content="#664bee" />
  <style>
    body, html {
      height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f4;
      font-family: "Courier New", Courier, monospace;
      color: #333;
    }

    .container {
      text-align: center;
    }

    .container img {
      max-width: 100px;
      height: auto;
      margin-bottom: 20px;
    }

    .container h1 {
      font-size: 48px;
      margin: 0;
    }

    .container p {
      font-size: 24px;
      margin: 20px 0;
    }

    .button {
      display: inline-block;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      outline: none;
      color: white;
      background-color: black;
      border: none;
      border-radius: 25px;
      box-shadow: 0 4px #999;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #555;
    }

    .button:active {
      background-color: #555;
      box-shadow: 0 2px #666;
      transform: translateY(2px);
    }

    .team {
      margin-top: 30px;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>

<div class="container">
  <img src="/4.png" alt="404 Image"> <!-- Replace with your image path -->
  <h1>404</h1>
  <p>🫷क्षमा करें, आप जिस पृष्ठ की तलाश कर रहे हैं वह मौजूद नहीं है।<br>Sorry, the page you are looking for does not exist.</p>
  <a href="/" class="button">↙️मुख्य पृष्ठ पर वापस जाएँ<br>Go Back to Home</a>
  <div class="team">
    <p>Team V</p>
  </div>
</div>

</body>
</html>
